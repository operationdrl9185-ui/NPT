<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NPT Data Entry | এনপিটি ডাটা এন্ট্রি</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --shadow-lg: 0 20px 40px -8px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 50%, #fce7f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            line-height: 1.5;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .container { width:100%; max-width: 600px; margin:0 auto; }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 20px;
            transition: box-shadow 0.3s ease;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .header { text-align: center; margin-bottom: 20px; }
        .header .icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 16px; font-size: 28px; color: white;
            margin-bottom: 12px; box-shadow: 0 8px 20px -4px rgba(59,130,246,0.4);
        }
        .header h1 {
            font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1e293b, #3b82f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .lang-switch { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .lang-switch .segmented {
            display: inline-flex; background: #f1f5f9; border-radius: 30px;
            padding: 3px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .lang-switch button {
            background: transparent; border: none; padding: 6px 16px;
            border-radius: 30px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; color: var(--text-secondary);
        }
        .lang-switch button.active { background: white; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .section { margin-bottom: 18px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: var(--text); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
        .form-group label .req { color: var(--error); margin-left: 2px; }
        .input-wrapper {
            display: flex; align-items: center; border: 2px solid var(--border);
            border-radius: var(--radius-sm); background: white; transition: var(--transition);
            min-height: 46px; overflow: hidden; position: relative;
        }
        .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
        .input-wrapper.error { border-color: var(--error); }
        .input-wrapper.success { border-color: var(--success); }
        .input-wrapper .prefix {
            padding: 0 12px; font-size: 18px; color: var(--text-secondary);
            background: #f8fafc; border-right: 1px solid var(--border);
            align-self: stretch; display: flex; align-items: center;
        }
        .input-wrapper input, .input-wrapper textarea, .input-wrapper select {
            width: 100%; padding: 11px 14px; border: none; outline: none;
            font-size: 15px; background: transparent; font-family: inherit; color: var(--text);
        }
        .input-wrapper input[type="time"], .input-wrapper input[type="date"] { font-size: 16px; }
        .input-wrapper textarea { min-height: 70px; resize: vertical; }
        .input-wrapper input[readonly] { background-color: #f8fafc; color: var(--text-secondary); font-weight: 600; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 18px; font-size: 15px; font-weight: 600; border: none;
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
            font-family: inherit; min-height: 46px; width: 100%;
            background: var(--primary); color: white; letter-spacing: 0.3px;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-verify { margin-top: 8px; background: linear-gradient(135deg, #3b82f6, #6366f1); }
        .btn-verify:hover:not(:disabled) { background: linear-gradient(135deg, #2563eb, #4f46e5); }
        .btn-submit { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-now {
            width: auto; padding: 0 12px; min-height: 46px; background: #e2e8f0;
            color: var(--text); font-size: 13px; white-space: nowrap;
        }
        .btn-now:hover { background: #cbd5e1; }
        .message {
            padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
            font-weight: 500; margin-top: 8px; display: none; animation: fadeIn 0.3s ease;
            background: #fef2f2; color: var(--error); border: 1px solid #fecaca;
        }
        .message.show { display: block; }
        .message.success { background: #ecfdf5; color: var(--success); border-color: #a7f3d0; }
        .info-box {
            background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 12px 16px; margin-top: 10px; display: none; animation: fadeIn 0.3s ease;
        }
        .info-box.show { display: block; }
        .info-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-top: 4px; }
        .info-value { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .suggestions { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; display: none; background: white; }
        .suggestions.show { display: block; animation: fadeIn 0.3s ease; }
        .suggestion-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:active { background: #f1f5f9; }
        .suggestion-item .sugg-id { font-weight: 700; color: var(--primary); margin-right: 6px; }
        .suggestion-item .sugg-name { color: var(--text-secondary); }
        .autocomplete-suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid var(--border);
            border-top: none; max-height: 200px; overflow-y: auto;
            z-index: 100; display: none;
        }
        .autocomplete-suggestions div { padding: 10px 14px; cursor: pointer; }
        .autocomplete-suggestions div:hover { background: #f1f5f9; }
        .divider { border: none; border-top: 1px dashed var(--border); margin: 18px 0; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(-5px); } to { opacity:1; transform: translateY(0); } }
        @media (max-width: 400px) {
            .card { padding: 16px 12px; }
            .header h1 { font-size: 20px; }
            .btn { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="lang-switch">
                <div class="segmented">
                    <button id="btnEn" class="active" onclick="setLanguage('en')">English</button>
                    <button id="btnBn" onclick="setLanguage('bn')">বাংলা</button>
                </div>
            </div>
            <div class="header">
                <div class="icon">📋</div>
                <h1 data-en="NPT Data Entry" data-bn="এনপিটি ডাটা এন্ট্রি">NPT Data Entry</h1>
                <p data-en="Verify & submit quickly" data-bn="যাচাই করুন ও দ্রুত জমা দিন">Verify & submit quickly</p>
            </div>

            <!-- Step 1: Mechanic Mobile -->
            <div class="section">
                <div class="form-group">
                    <label data-en="Mechanic Mobile" data-bn="মেকানিক মোবাইল">Mechanic Mobile <span class="req">*</span></label>
                    <div class="input-wrapper" id="mobileWrapper">
                        <span class="prefix">📱</span>
                        <input type="tel" id="mobileNumber" placeholder="Mobile number" data-en-placeholder="Mobile number" data-bn-placeholder="মোবাইল নম্বর" maxlength="15" autocomplete="off" oninput="showMobileAutocomplete(this.value)">
                    </div>
                    <div class="autocomplete-suggestions" id="suggest-mobileNumber"></div>
                    <button class="btn btn-verify" id="verifyMobileBtn" onclick="verifyMobile()" data-en="Verify Number" data-bn="নম্বর যাচাই করুন">Verify Number</button>
                </div>
                <div id="verifyMessage" class="message"></div>
                <div id="mechanicInfo" class="info-box">
                    <div class="info-label" data-en="Mechanic" data-bn="মেকানিক">Mechanic</div>
                    <div class="info-value" id="mechanicName"></div>
                    <div class="info-label" data-en="Designation" data-bn="পদবি">Designation</div>
                    <div class="info-value" id="mechanicDesignation"></div>
                </div>
            </div>

            <!-- Step 2: Machine Search -->
            <div id="machineSection" style="display:none;">
                <div class="divider"></div>
                <div class="section">
                    <div class="form-group">
                        <label data-en="Machine Search (SL No, Machine ID, S.L No)" data-bn="মেশিন খুঁজুন (এসএল নং, মেশিন আইডি, এস.এল নং)">Machine Search (SL No, Machine ID, S.L No) <span class="req">*</span></label>
                        <div class="input-wrapper" id="machineWrapper">
                            <span class="prefix">🔍</span>
                            <input type="text" id="machineSearch" placeholder="Enter SL No, Machine ID, or S.L No" data-en-placeholder="Enter SL No, Machine ID, or S.L No" data-bn-placeholder="এসএল নং, মেশিন আইডি বা এস.এল নং লিখুন">
                        </div>
                        <button class="btn btn-verify" id="lookupMachineBtn" onclick="lookupMachine()" data-en="Search Machine" data-bn="মেশিন খুঁজুন">Search Machine</button>
                    </div>
                    <div id="machineMessage" class="message"></div>
                    <div id="suggestions" class="suggestions"></div>
                    <div id="machineInfo" class="info-box">
                        <div class="info-label" data-en="Machine" data-bn="মেশিন">Machine</div>
                        <div class="info-value" id="machineNameDisplay"></div>
                        <div class="info-label" data-en="Brand / Model" data-bn="ব্র্যান্ড / মডেল">Brand / Model</div>
                        <div class="info-value" id="machineBrandModel"></div>
                        <div class="info-label" data-en="Location" data-bn="অবস্থান">Location</div>
                        <div class="info-value" id="machineLocation"></div>
                    </div>
                </div>
            </div>

            <!-- Step 3: NPT Entry Form -->
            <div id="nptForm" style="display:none;">
                <div class="divider"></div>
                <div class="section">
                    <div class="section-title" data-en="📝 NPT Details" data-bn="📝 এনপিটি বিবরণ">📝 NPT Details</div>
                    
                    <div class="form-group">
                        <label data-en="Date" data-bn="তারিখ">Date <span class="req">*</span></label>
                        <div class="input-wrapper"><span class="prefix">📅</span><input type="date" id="date" required></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Line No" data-bn="লাইন নং">Line No <span class="req">*</span></label>
                        <div class="input-wrapper"><span class="prefix">🏭</span>
                            <select id="lineNo" required><option value="">--</option></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-en="Operator Name" data-bn="অপারেটর নাম">Operator Name <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <span class="prefix">👤</span>
                            <input type="text" id="operatorName" required autocomplete="off" oninput="showAutocomplete('operatorName', this.value)">
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-operatorName"></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Reason / Problem" data-bn="কারণ / সমস্যা">Reason / Problem <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <span class="prefix">⚠️</span>
                            <textarea id="reasonProblem" required autocomplete="off" oninput="showAutocomplete('reasonProblem', this.value)"></textarea>
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-reasonProblem"></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Operation Name" data-bn="অপারেশন নাম">Operation Name</label>
                        <div class="input-wrapper">
                            <span class="prefix">⚙️</span>
                            <input type="text" id="operationName" autocomplete="off" oninput="showAutocomplete('operationName', this.value)">
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-operationName"></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Buyer Name" data-bn="বায়ার নাম">Buyer Name</label>
                        <div class="input-wrapper">
                            <span class="prefix">🏢</span>
                            <input type="text" id="buyerName" autocomplete="off" oninput="showAutocomplete('buyerName', this.value)">
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-buyerName"></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Inform Time" data-bn="তথ্য দেওয়ার সময়">Inform Time</label>
                        <div style="display:flex; gap:6px;">
                            <div class="input-wrapper" style="flex:1;"><span class="prefix">🕒</span><input type="time" id="informTime" step="60"></div>
                            <button type="button" class="btn btn-now" onclick="setNow('informTime')">Now</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-en="Work Start Time" data-bn="কাজ শুরুর সময়">Work Start Time <span class="req">*</span></label>
                        <div style="display:flex; gap:6px;">
                            <div class="input-wrapper" style="flex:1;"><span class="prefix">⏰</span><input type="time" id="workStartTime" required step="60"></div>
                            <button type="button" class="btn btn-now" onclick="setNow('workStartTime')">Now</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-en="Work End Time" data-bn="কাজ শেষের সময়">Work End Time <span class="req">*</span></label>
                        <div style="display:flex; gap:6px;">
                            <div class="input-wrapper" style="flex:1;"><span class="prefix">🏁</span><input type="time" id="workEndTime" required step="60"></div>
                            <button type="button" class="btn btn-now" onclick="setNow('workEndTime')">Now</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-en="Loss Time (Min) - auto calculated" data-bn="লস টাইম (মিনিট) - স্বয়ংক্রিয়">Loss Time (Min) - auto calculated <span class="req">*</span></label>
                        <div class="input-wrapper"><span class="prefix">⏱️</span><input type="number" id="lossTime" min="0" readonly></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Affected Man" data-bn="আক্রান্ত ব্যক্তি">Affected Man</label>
                        <div class="input-wrapper">
                            <span class="prefix">👥</span>
                            <input type="text" id="affectedMan" autocomplete="off" oninput="showAutocomplete('affectedMan', this.value)">
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-affectedMan"></div>
                    </div>
                    <div class="form-group">
                        <label data-en="Supervisor / Line Chief Signature" data-bn="সুপারভাইজার / লাইন চিফ স্বাক্ষর">Supervisor / Line Chief Signature</label>
                        <div class="input-wrapper">
                            <span class="prefix">✍️</span>
                            <input type="text" id="supervisorSign" autocomplete="off" oninput="showAutocomplete('supervisorSign', this.value)">
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-supervisorSign"></div>
                    </div>
                    <div class="form-group">
                        <label data-en="MC floor In-charge signature" data-bn="এমসি ফ্লোর ইনচার্জ স্বাক্ষর">MC floor In-charge signature</label>
                        <div class="input-wrapper">
                            <span class="prefix">🖊️</span>
                            <input type="text" id="mcFloorInchargeSign" autocomplete="off" oninput="showAutocomplete('mcFloorInchargeSign', this.value)">
                        </div>
                        <div class="autocomplete-suggestions" id="suggest-mcFloorInchargeSign"></div>
                    </div>

                    <button class="btn btn-submit" id="submitBtn" onclick="submitData()" data-en="Submit Entry" data-bn="এন্ট্রি জমা দিন">Submit Entry</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API base URL (আপনার নতুন Apps Script URL)
        const API_BASE = 'https://script.google.com/macros/s/AKfycby5gKscD7t2FsZkKHBvCcUaSvhg5yMnU2QWliPRLzLBcyOuAjhtfMF56TdQ6OmzRCte/exec';

        // ভাষা
        let currentLang = 'en';
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnBn').classList.toggle('active', lang === 'bn');
            document.querySelectorAll('[data-en][data-bn]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
            document.querySelectorAll('[data-en-placeholder][data-bn-placeholder]').forEach(el => {
                el.placeholder = el.getAttribute('data-' + lang + '-placeholder');
            });
        }
        setLanguage('en');

        // লাইন নম্বর ড্রপডাউন (1-24)
        (function populateLineNumbers() {
            const select = document.getElementById('lineNo');
            for (let i = 1; i <= 24; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                select.appendChild(option);
            }
        })();

        // আজকের তারিখ
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        function setNow(inputId) {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            document.getElementById(inputId).value = hh + ':' + mm;
            calculateLossTime();
        }

        // fetch helpers
        async function apiGet(params) {
            const query = new URLSearchParams(params).toString();
            const response = await fetch(`${API_BASE}?${query}`);
            return await response.json();
        }
        async function apiPost(data) {
            const response = await fetch(`${API_BASE}?action=submit`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            return await response.json();
        }

        // মোবাইল সাজেশন
        async function showMobileAutocomplete(query) {
            const container = document.getElementById('suggest-mobileNumber');
            if (!query.trim()) { container.style.display='none'; container.innerHTML=''; return; }
            try {
                const suggestions = await apiGet({action:'mobileSuggestions', query:query});
                container.innerHTML='';
                if (suggestions.length===0) { container.style.display='none'; return; }
                suggestions.forEach(val=>{
                    const div=document.createElement('div');
                    div.textContent=val;
                    div.onclick=()=>{
                        document.getElementById('mobileNumber').value=val;
                        container.style.display='none';
                        container.innerHTML='';
                        verifyMobile();
                    };
                    container.appendChild(div);
                });
                container.style.display='block';
            } catch(e) { console.error(e); }
        }

        // সাধারণ সাজেশন
        async function showAutocomplete(field, query) {
            const container=document.getElementById('suggest-'+field);
            if(!query.trim()){container.style.display='none';container.innerHTML='';return;}
            try {
                const suggestions=await apiGet({action:'suggestions', field:field, query:query});
                container.innerHTML='';
                if(suggestions.length===0){container.style.display='none';return;}
                suggestions.forEach(val=>{
                    const div=document.createElement('div');
                    div.textContent=val;
                    div.onclick=()=>{
                        document.getElementById(field).value=val;
                        container.style.display='none';
                        container.innerHTML='';
                    };
                    container.appendChild(div);
                });
                container.style.display='block';
            } catch(e) { console.error(e); }
        }

        // বাইরে ক্লিক করলে সাজেশন বন্ধ
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.input-wrapper')) {
                document.querySelectorAll('.autocomplete-suggestions').forEach(el => {
                    el.style.display = 'none';
                    el.innerHTML = '';
                });
            }
        });

        // স্টেট
        let isMobileVerified = false;
        let verifiedMechanic = { name:'', designation:'', idNo:'', mobile:'' };
        let isMachineVerified = false;
        let machineDetails = { machineName:'', brand:'', model:'', location:'', machineId:'' };

        function showMessage(id, type, text) {
            const el = document.getElementById(id);
            el.className = 'message show ' + type;
            el.textContent = text;
        }
        function hideMessage(id) { document.getElementById(id).className = 'message'; }

        // লস টাইম ক্যালকুলেশন
        function calculateLossTime() {
            const workStart = document.getElementById('workStartTime').value;
            const workEnd = document.getElementById('workEndTime').value;
            const lossField = document.getElementById('lossTime');
            if (!workStart || !workEnd) {
                lossField.value = '';
                return;
            }
            function timeToMinutes(timeStr) {
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            }
            const start = timeToMinutes(workStart);
            const end = timeToMinutes(workEnd);
            let diff = end - start;
            if (diff < 0) diff += 24 * 60;
            lossField.value = diff;
        }
        document.getElementById('workStartTime').addEventListener('change', calculateLossTime);
        document.getElementById('workEndTime').addEventListener('change', calculateLossTime);

        // মোবাইল যাচাই
        async function verifyMobile() {
            const mobileRaw = document.getElementById('mobileNumber').value.trim();
            if (!mobileRaw || mobileRaw.replace(/\D/g,'').length < 7) {
                showMessage('verifyMessage', 'error', currentLang === 'en' ? 'Enter valid mobile number' : 'সঠিক মোবাইল নম্বর দিন');
                return;
            }
            hideMessage('verifyMessage');
            const btn = document.getElementById('verifyMobileBtn');
            btn.disabled = true;
            btn.innerHTML = currentLang === 'en' ? 'Checking...' : 'যাচাই হচ্ছে...';
            try {
                const res = await apiGet({action:'checkMobile', mobile:mobileRaw});
                btn.disabled = false;
                btn.innerHTML = currentLang === 'en' ? 'Verify Number' : 'নম্বর যাচাই করুন';
                if (res.success) {
                    isMobileVerified = true;
                    verifiedMechanic.name = res.name;
                    verifiedMechanic.designation = res.designation;
                    verifiedMechanic.idNo = res.idNo;
                    verifiedMechanic.mobile = mobileRaw;
                    document.getElementById('mechanicName').textContent = res.name;
                    document.getElementById('mechanicDesignation').textContent = res.designation;
                    document.getElementById('mechanicInfo').classList.add('show');
                    document.getElementById('mobileWrapper').classList.add('success');
                    showMessage('verifyMessage', 'success', currentLang === 'en' ? '✅ Verified' : '✅ যাচাই সম্পন্ন');
                    document.getElementById('machineSection').style.display = 'block';
                } else {
                    isMobileVerified = false;
                    document.getElementById('mobileWrapper').classList.add('error');
                    showMessage('verifyMessage', 'error', currentLang === 'en' ? 'Number not found' : 'নম্বর পাওয়া যায়নি');
                }
            } catch(err) {
                btn.disabled = false;
                btn.innerHTML = currentLang === 'en' ? 'Verify Number' : 'নম্বর যাচাই করুন';
                showMessage('verifyMessage', 'error', 'Error: ' + err.message);
            }
        }

        // মেশিন খোঁজা
        async function lookupMachine() {
            if (!isMobileVerified) { alert(currentLang === 'en' ? 'Verify mobile first' : 'প্রথমে মোবাইল যাচাই করুন'); return; }
            const searchTerm = document.getElementById('machineSearch').value.trim();
            if (!searchTerm) { showMessage('machineMessage', 'error', currentLang === 'en' ? 'Enter search term' : 'অনুসন্ধান শব্দ দিন'); return; }
            hideMessage('machineMessage');
            document.getElementById('suggestions').classList.remove('show');
            document.getElementById('suggestions').innerHTML = '';
            const btn = document.getElementById('lookupMachineBtn');
            btn.disabled = true;
            btn.innerHTML = currentLang === 'en' ? 'Searching...' : 'খোঁজা হচ্ছে...';
            try {
                const res = await apiGet({action:'machineSearch', term:searchTerm});
                btn.disabled = false;
                btn.innerHTML = currentLang === 'en' ? 'Search Machine' : 'মেশিন খুঁজুন';
                if (res.success) {
                    isMachineVerified = true;
                    machineDetails = {
                        machineName: res.machineName,
                        brand: res.brandName,
                        model: res.model,
                        location: res.location,
                        machineId: res.machineId
                    };
                    document.getElementById('machineNameDisplay').textContent = res.machineName;
                    document.getElementById('machineBrandModel').textContent = res.brandName + ' ' + res.model;
                    document.getElementById('machineLocation').textContent = res.location;
                    document.getElementById('machineInfo').classList.add('show');
                    document.getElementById('machineWrapper').classList.add('success');
                    showMessage('machineMessage', 'success', currentLang === 'en' ? '✅ Machine found' : '✅ মেশিন পাওয়া গেছে');
                    document.getElementById('nptForm').style.display = 'block';
                } else if (res.suggestions && res.suggestions.length > 0) {
                    document.getElementById('machineWrapper').classList.remove('error');
                    showMessage('machineMessage', 'error', currentLang === 'en' ? 'No exact match. Did you mean:' : 'সঠিক মিল নেই। আপনি কি বোঝাতে চেয়েছেন:');
                    const suggBox = document.getElementById('suggestions');
                    suggBox.innerHTML = '';
                    res.suggestions.forEach(sugg => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        let identifierText = '';
                        if (sugg.slNo) identifierText += `SL: ${sugg.slNo} `;
                        if (sugg.machineId) identifierText += `ID: ${sugg.machineId} `;
                        if (sugg.slNo2) identifierText += `S.L: ${sugg.slNo2}`;
                        div.innerHTML = `<span class="sugg-id">${identifierText}</span> <span class="sugg-name">${sugg.machineName} (${sugg.brandName} ${sugg.model})</span>`;
                        div.onclick = function() {
                            const exactId = sugg.machineId || sugg.slNo || sugg.slNo2;
                            document.getElementById('machineSearch').value = exactId;
                            suggBox.classList.remove('show');
                            lookupMachine();
                        };
                        suggBox.appendChild(div);
                    });
                    suggBox.classList.add('show');
                } else {
                    isMachineVerified = false;
                    document.getElementById('machineWrapper').classList.add('error');
                    showMessage('machineMessage', 'error', currentLang === 'en' ? 'Machine not found' : 'মেশিন পাওয়া যায়নি');
                }
            } catch(err) {
                btn.disabled = false;
                btn.innerHTML = currentLang === 'en' ? 'Search Machine' : 'মেশিন খুঁজুন';
                showMessage('machineMessage', 'error', 'Error: ' + err.message);
            }
        }

        // সাবমিট
        async function submitData() {
            if (!isMobileVerified || !isMachineVerified) { alert(currentLang === 'en' ? 'Complete verifications first' : 'প্রথমে যাচাই সম্পন্ন করুন'); return; }
            const date = document.getElementById('date').value;
            const lineNo = document.getElementById('lineNo').value;
            const operatorName = document.getElementById('operatorName').value.trim();
            const reasonProblem = document.getElementById('reasonProblem').value.trim();
            const workStartTime = document.getElementById('workStartTime').value;
            const workEndTime = document.getElementById('workEndTime').value;
            const lossTime = document.getElementById('lossTime').value;
            if (!date || !lineNo || !operatorName || !reasonProblem || !workStartTime || !workEndTime || !lossTime) {
                alert(currentLang === 'en' ? 'Please fill all required fields' : 'সব আবশ্যক ঘর পূরণ করুন');
                return;
            }
            const operationName = document.getElementById('operationName').value.trim();
            const buyerName = document.getElementById('buyerName').value.trim();
            const informTime = document.getElementById('informTime').value;
            const affectedMan = document.getElementById('affectedMan').value.trim();
            const supervisorSign = document.getElementById('supervisorSign').value.trim();
            const mcFloorInchargeSign = document.getElementById('mcFloorInchargeSign').value.trim();
            const formData = {
                date, lineNo, machineName: machineDetails.machineName, machineId: machineDetails.machineId,
                mechanicName: verifiedMechanic.name, operatorName, operationName, buyerName, reasonProblem,
                informTime, workStartTime, workEndTime, lossTime, affectedMan, supervisorSign, mcFloorInchargeSign
            };
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = currentLang === 'en' ? 'Submitting...' : 'জমা হচ্ছে...';
            try {
                const res = await apiPost(formData);
                btn.disabled = false;
                btn.innerHTML = currentLang === 'en' ? 'Submit Entry' : 'এন্ট্রি জমা দিন';
                if (res.success) {
                    alert(currentLang === 'en' ? '✅ Entry submitted!' : '✅ এন্ট্রি জমা হয়েছে!');
                    // ফর্ম রিসেট
                    location.reload();
                } else {
                    alert('❌ ' + (res.error || 'Unknown error'));
                }
            } catch(err) {
                btn.disabled = false;
                btn.innerHTML = currentLang === 'en' ? 'Submit Entry' : 'এন্ট্রি জমা দিন';
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
